<p-toast></p-toast>

<div class="admin-page-shell">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h2 class="admin-page-title m-0">Profile</h2>
      <p class="admin-page-subtitle mt-1 mb-0">Manage your account details and security settings.</p>
    </div>
    <button pButton type="button" label="Update Profile" icon="pi pi-save" [loading]="saving()" (click)="updateProfile()"></button>
  </div>

  <section class="grid grid-cols-1 gap-6 lg:grid-cols-[320px_minmax(0,1fr)]">
    <p-card>
      <div class="text-center">
        <div class="mx-auto flex h-24 w-24 items-center justify-center rounded-full bg-blue-100 text-4xl font-bold text-blue-600">
          {{ userLetter() }}
        </div>
        <p class="m-0 mt-4 text-2xl font-semibold text-gray-900">{{ userName() }}</p>
        <p-tag [value]="role() | uppercase" [severity]="role() === 'admin' ? 'danger' : 'success'" styleClass="mt-3"></p-tag>
      </div>

      <div class="mt-6 space-y-4">
        <div>
          <p class="m-0 text-xs uppercase tracking-wide text-gray-400">Email</p>
          <p class="m-0 mt-1 font-medium text-gray-900">{{ userInfo().email }}</p>
        </div>
        <div>
          <p class="m-0 text-xs uppercase tracking-wide text-gray-400">Role</p>
          <p class="m-0 mt-1 font-medium text-gray-900">{{ role() | titlecase }}</p>
        </div>
        <div>
          <p class="m-0 text-xs uppercase tracking-wide text-gray-400">Member Since</p>
          <p class="m-0 mt-1 font-medium text-gray-900">{{ userInfo().created_at | date:'mediumDate' }}</p>
        </div>
      </div>
    </p-card>

    <div class="space-y-6">
      <p-card>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <div>
            <label class="mb-2 block text-sm font-medium text-gray-700">Display Name</label>
            <input
              pInputText
              [ngModel]="profileForm().full_name"
              (ngModelChange)="profileForm.set({ ...profileForm(), full_name: $event })"
              class="w-full" />
          </div>
          <div>
            <label class="mb-2 block text-sm font-medium text-gray-700">Phone</label>
            <input
              pInputText
              [ngModel]="profileForm().phone"
              (ngModelChange)="profileForm.set({ ...profileForm(), phone: $event })"
              class="w-full" />
          </div>
          <div class="md:col-span-2">
            <label class="mb-2 block text-sm font-medium text-gray-700">City</label>
            <input
              pInputText
              [ngModel]="profileForm().city"
              (ngModelChange)="profileForm.set({ ...profileForm(), city: $event })"
              class="w-full" />
          </div>
        </div>
      </p-card>

      <p-card>
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div>
            <p class="m-0 text-lg font-semibold text-gray-900">Change Password</p>
            <p class="m-0 mt-1 text-sm text-gray-500">Send a secure password reset link to your email address.</p>
          </div>
          <button pButton type="button" label="Send Reset Link" icon="pi pi-lock" outlined (click)="changePassword()"></button>
        </div>
      </p-card>
    </div>
  </section>
</div>
