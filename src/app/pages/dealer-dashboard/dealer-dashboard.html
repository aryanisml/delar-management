<div class="dashboard">

  <div class="dashboard-top-section">
    <div class="kpi-wrapper">
      <p-card class="kpi-card">
        <div class="stat-content">
          <i class="pi pi-car" style="font-size: 2.5rem; color: #3B82F6"></i>
          <div>
            <span class="stat-title">Fleet Size</span>
            <span class="stat-value">{{ vehicles().length }}</span>
          </div>
        </div>
      </p-card>

      <p-card class="kpi-card">
        <div class="stat-content">
          <i class="pi pi-check-circle" style="font-size: 2.5rem; color: #10B981"></i>
          <div>
            <span class="stat-title">Available Now</span>
            <span class="stat-value">{{ availableVehicles().reduce((sum,v)=>sum + v.available, 0) }}</span>
          </div>
        </div>
      </p-card>
    </div>

    <p-card class="chart-card" header="Fleet Status Overview">
      <p-chart type="doughnut" [data]="chartData()" [options]="chartOptions"></p-chart>
    </p-card>
  </div>

  <main class="content">
    <p-card class="shadow">
      
      <div class="card-title text-xl font-semibold mb-3">Vehicles</div>

      <p-toolbar class="mb-3">
        <div class="p-toolbar-group-right">
          <span class="p-input-icon-left">
            <i class="pi pi-search"></i>
            <input
              pInputText
              type="search"
              (input)="setFilter($any($event.target).value)"
              placeholder="Search brand, make or model..."
              class="w-80" />
          </span>
        </div>
      </p-toolbar>

      <div class="table-wrap bg-white rounded border">
        @if (loading()) {
          <p-progressSpinner styleClass="center-spinner"></p-progressSpinner>
        }

        @if (!loading()) {
          <app-reusable-table 
            [data]="availableVehicles()" 
            [cols]="tableColumns" 
            [actionTemplate]="bookBtn">
          </app-reusable-table>
        }

        @if (!loading() && availableVehicles().length === 0) {
          <div class="empty">No vehicles found</div>
        }
      </div>

    </p-card>
  </main>
</div>

<ng-template #bookBtn let-row>
  <button 
    pButton 
    label="Book" 
    icon="pi pi-calendar" 
    class="p-button-sm" 
    [disabled]="row.available <= 0"
    (click)="openBooking(row)">
  </button>
</ng-template>

<app-booking-dialog
  [vehicle]="selectedVehicle()!"
  [visible]="bookingDialogVisible()"
  (close)="closeBooking()"
  (submitBooking)="submitBooking($event)">
</app-booking-dialog>
