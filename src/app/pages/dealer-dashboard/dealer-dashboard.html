

<main class="content">

  <p-card class="shadow">


<ng-template pTemplate="title">
  <div class="card-title text-xl font-semibold">Vehicles</div>
</ng-template>

<p-toolbar class="mb-3">

  <div class="p-toolbar-group-right">

    <span class="p-input-icon-left">
      <i class="pi pi-search"></i>

      <input
        pInputText
        type="search"
        (input)="setFilter($any($event.target).value)"
        placeholder="Search brand, make or model..."
        class="w-80" />

    </span>

  </div>

</p-toolbar>


<div class="table-wrap bg-white rounded border">

  @if (loading()) {

    <p-progressSpinner styleClass="center-spinner"></p-progressSpinner>

  }

  @if (!loading()) {

    <p-table 
  [value]="availableVehicles()" 
  [paginator]="true" 
  [rows]="12" 
  [rowsPerPageOptions]="[12,24,48]"
  [showCurrentPageReport]="true" 
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
  responsiveLayout="scroll" 
  rowHover="true" 
  sortField="brand" 
  [sortOrder]="1"
  class="p-datatable-striped p-datatable-hover">

  <ng-template pTemplate="header">
    <tr>
      <th>Action</th>
      <th pSortableColumn="vin">
        VIN <p-sortIcon field="vin"></p-sortIcon>
      </th>
      <th pSortableColumn="brand">
        Brand <p-sortIcon field="brand"></p-sortIcon>
      </th>
      <th pSortableColumn="model">
        Model <p-sortIcon field="model"></p-sortIcon>
      </th>
      <th pSortableColumn="location">
        Location <p-sortIcon field="location"></p-sortIcon>
      </th>

      <th pSortableColumn="daily_rate">
        Price/Day <p-sortIcon field="daily_rate"></p-sortIcon>
      </th>

      <th>Status</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-row>
    <tr>
      <td>
        <button 
          pButton 
          label="Book" 
          icon="pi pi-calendar" 
          class="p-button-sm" 
          [disabled]="row.available <= 0"
          (click)="openBooking(row)">
        </button>
      </td>

      <td>{{ row.vin }}</td>
      <td>{{ row.brand }}</td>
      <td>{{ row.model }}</td>

      <td>
        <i class="pi pi-map-marker text-gray-500 mr-1"></i>
        {{ row.location }}
      </td>

      <td class="font-semibold text-green-600">
        {{ row.daily_rate | currency }}
      </td>

      <td>
        <p-tag 
          [value]="row.available > 0 ? 'Available' : 'Out of Stock'"
          [severity]="row.available > 0 ? 'success' : 'danger'">
        </p-tag>
      </td>
    </tr>
  </ng-template>

</p-table>

  }

  @if (!loading() && availableVehicles().length === 0) {

    <div class="empty">No vehicles found</div>

  }

</div>


  </p-card>

</main>

<!-- Booking Dialog Component -->

<app-booking-dialog
[vehicle]="selectedVehicle()!"
[visible]="bookingDialogVisible()"
(close)="closeBooking()"
(submitBooking)="submitBooking($event)"> </app-booking-dialog>
