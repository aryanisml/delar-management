<section class="dealer-page dashboard-shell">
  <p-card class="dashboard-panel">
    <ng-template pTemplate="title">Analytics</ng-template>
    <p class="page-copy">
      Reporting actions are lower-frequency, so ghost and soft buttons work well here for exports,
      comparisons and trend review without creating visual noise.
    </p>
    <div class="dashboard-button-row">
      <button pButton label="View Trends" icon="pi pi-chart-line" class="dashboard-btn dashboard-btn--ghost"></button>
      <button pButton label="Download Report" icon="pi pi-download" class="dashboard-btn dashboard-btn--soft"></button>
    </div>
  </p-card>
</section>
