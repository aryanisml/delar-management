<div class="grid gap-4">

  <!-- ===================== -->
  <!-- KPI SECTION -->
  <!-- ===================== -->

  <div class="grid grid-cols-4 gap-4">

    <p-card header="Total Vehicles">
      <h2 class="text-2xl font-bold">{{ totalVehicles }}</h2>
    </p-card>

    <p-card header="Active Vehicles">
      <h2 class="text-2xl font-bold text-green-500">
        {{ activeCount }}
      </h2>
    </p-card>

    <p-card header="Maintenance">
      <h2 class="text-2xl font-bold text-yellow-500">
        {{ maintenanceCount }}
      </h2>
    </p-card>

    <p-card header="Avg Daily Rate">
      <h2 class="text-2xl font-bold">
        ₹{{ avgDailyRate }}
      </h2>
    </p-card>

  </div>

  <!-- ===================== -->
  <!-- REVENUE SUMMARY -->
  <!-- ===================== -->

  <p-card header="Estimated Monthly Revenue">
    <div class="text-3xl font-bold text-blue-600">
      ₹{{ estimatedMonthlyRevenue }}
    </div>
  </p-card>

  <!-- ===================== -->
  <!-- CHARTS GRID -->
  <!-- ===================== -->

  <div class="grid grid-cols-2 gap-4">

    <p-card header="Revenue by Vehicle">
      <p-chart type="bar" [data]="revenueChartData"></p-chart>
    </p-card>

    <p-card header="Vehicle Status Distribution">
      <p-chart type="pie" [data]="statusChartData"></p-chart>
    </p-card>

    <p-card header="Vehicles by Location">
      <p-chart type="bar" [data]="locationChartData"></p-chart>
    </p-card>

  </div>

  <!-- ===================== -->
  <!-- TOP PERFORMER -->
  <!-- ===================== -->

  <p-card header="Top Performing Vehicle" *ngIf="topVehicle">
    <div class="text-lg">
      <strong>{{ topVehicle.model }}</strong>
      <div>
        Estimated Monthly Revenue:
        ₹{{ (topVehicle.daily_rate || 0) * 30 * (topVehicle.Stock || 0) }}
      </div>
    </div>
  </p-card>

</div>
