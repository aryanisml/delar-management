<div class="admin-page-shell">
  <section class="grid grid-cols-1 gap-4 md:grid-cols-3">
    @for (metric of topMetrics(); track metric.label) {
      <p-card>
        <p class="admin-section-label mb-2">{{ metric.label }}</p>
        <p class="m-0 text-3xl font-bold text-gray-900">{{ metric.value }}</p>
      </p-card>
    }
  </section>

  <section class="grid grid-cols-1 gap-6 lg:grid-cols-3">
    <p-card styleClass="lg:col-span-2">
      <p class="admin-section-label mb-4">Demand vs Conversion</p>
      <div class="h-80">
        <p-chart type="line" [data]="trendChart()" [options]="{ maintainAspectRatio: false }"></p-chart>
      </div>
    </p-card>

    <p-card>
      <p class="admin-section-label mb-4">Fleet Status</p>
      <div class="h-80">
        <p-chart type="doughnut" [data]="statusChart()" [options]="{ maintainAspectRatio: false }"></p-chart>
      </div>
    </p-card>
  </section>

  <p-card>
    <p class="admin-section-label mb-4">Purpose Conversion Mix</p>
    <div class="grid gap-5 md:grid-cols-2">
      @for (item of purposeBreakdown(); track item.label) {
        <div>
          <div class="mb-2 flex items-center justify-between">
            <span class="text-sm font-medium text-gray-700">{{ item.label }}</span>
            <span class="text-sm font-semibold text-gray-900">{{ item.pct }}%</span>
          </div>
          <p-progressBar [value]="item.pct" [showValue]="false"></p-progressBar>
        </div>
      }
    </div>
  </p-card>
</div>
