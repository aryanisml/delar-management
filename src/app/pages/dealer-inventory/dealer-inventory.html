<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="grid gap-4">

  <!-- ===================== -->
  <!-- KPI STRIP -->
  <!-- ===================== -->

  <div class="grid grid-cols-4 gap-4">

    <p-card header="Total Vehicles">
      <h2 class="text-2xl font-bold">{{ totalVehicles }}</h2>
    </p-card>

    <p-card header="Available">
      <h2 class="text-2xl font-bold text-green-600">
        {{ availableNow }}
      </h2>
    </p-card>

    <p-card header="Inactive">
      <h2 class="text-2xl font-bold text-gray-500">
        {{ inactiveCount }}
      </h2>
    </p-card>

    <p-card header="Maintenance">
      <h2 class="text-2xl font-bold text-yellow-600">
        {{ maintenanceCount }}
      </h2>
    </p-card>

  </div>

  <!-- ===================== -->
  <!-- FILTER + SEARCH -->
  <!-- ===================== -->

  <p-card header="Inventory Controls">

    <div class="flex flex-wrap gap-3 items-center justify-between">

      <div class="flex gap-2">

        <button
          pButton
          label="All"
          [outlined]="activeFilter !== 'all'"
          (click)="setFilter('all')">
        </button>

        <button
          pButton
          label="Available"
          severity="success"
          [outlined]="activeFilter !== 'available'"
          (click)="setFilter('available')">
        </button>

        <button
          pButton
          label="Inactive"
          severity="secondary"
          [outlined]="activeFilter !== 'inactive'"
          (click)="setFilter('inactive')">
        </button>

        <button
          pButton
          label="Maintenance"
          severity="warn"
          [outlined]="activeFilter !== 'maintenance'"
          (click)="setFilter('maintenance')">
        </button>

      </div>

      <div class="flex gap-2 items-center">

        <input
          pInputText
          placeholder="Search by brand, model, location..."
          [(ngModel)]="searchTerm"
          (ngModelChange)="applyFilters()"
          class="w-64"
        />

        <button
          pButton
          label="Add Vehicle"
          icon="pi pi-plus"
          (click)="openNew()">
        </button>

      </div>

    </div>

  </p-card>

  <!-- ===================== -->
  <!-- SMART SUGGESTION -->
  <!-- ===================== -->

  <p-card *ngIf="smartSuggestion" header="Smart Suggestion">
    <div class="flex justify-between items-center">
      <div>
        🔎 Looking for deeper insights?
      </div>
      <button
        pButton
        label="Open"
        (click)="navigateToSuggestion()">
      </button>
    </div>
  </p-card>

  <!-- ===================== -->
  <!-- INVENTORY TABLE -->
  <!-- ===================== -->

  <p-card header="Vehicle Inventory">

    <p-table
      [value]="filteredVehicles"
      [paginator]="true"
      [rows]="10"
      responsiveLayout="scroll"
    >

      <ng-template pTemplate="header">
        <tr>
          <th>Brand</th>
          <th>Model</th>
          <th>Location</th>
          <th>Status</th>
          <th>Daily Rate</th>
          <th>Stock</th>
          <th style="width: 150px">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-vehicle>
        <tr>
          <td>{{ vehicle.Brand }}</td>
          <td>{{ vehicle.model }}</td>
          <td>{{ vehicle.location }}</td>
          <td>
            <p-tag
              [value]="vehicle.status"
              [severity]="
                vehicle.status === 'active' ? 'success' :
                vehicle.status === 'maintenance' ? 'warn' :
                'secondary'
              ">
            </p-tag>
          </td>
          <td>₹{{ vehicle.daily_rate }}</td>
          <td>{{ vehicle.Stock }}</td>
          <td class="flex gap-2">

            <button
              pButton
              icon="pi pi-pencil"
              severity="info"
              (click)="editVehicle(vehicle)">
            </button>

            <button
              pButton
              icon="pi pi-trash"
              severity="danger"
              (click)="deleteVehicle(vehicle)">
            </button>

          </td>
        </tr>
      </ng-template>

    </p-table>

  </p-card>

</div>

<!-- ===================== -->
<!-- ADD / EDIT DIALOG -->
<!-- ===================== -->

<p-dialog
  [(visible)]="displayDialog"
  [modal]="true"
  [closable]="true"
  [style]="{ width: '400px' }"
  header="Vehicle">

  <div class="flex flex-col gap-3">

    <input
      pInputText
      placeholder="Brand"
      [(ngModel)]="newVehicle.Brand"
    />

    <input
      pInputText
      placeholder="Model"
      [(ngModel)]="newVehicle.model"
    />

    <input
      pInputText
      placeholder="Location"
      [(ngModel)]="newVehicle.location"
    />

    <input
      pInputText
      type="number"
      placeholder="Daily Rate"
      [(ngModel)]="newVehicle.daily_rate"
    />

    <input
      pInputText
      type="number"
      placeholder="Stock"
      [(ngModel)]="newVehicle.Stock"
    />

    <button
      pButton
      label="Save"
      (click)="saveVehicle()">
    </button>

  </div>

</p-dialog>
