<section class="dealer-page dashboard-shell">
  <p-card class="dashboard-panel">
    <ng-template pTemplate="title">Inventory</ng-template>
    <p class="page-copy">
      Use this page to manage vehicle availability, pricing and listing quality. The primary action
      stays visually strongest so dealers can update fleet data quickly.
    </p>
    <div class="dashboard-button-row">
      <button pButton label="Add Vehicle" icon="pi pi-plus" class="dashboard-btn dashboard-btn--hero"></button>
      <button pButton label="Bulk Update" icon="pi pi-file-edit" class="dashboard-btn dashboard-btn--soft"></button>
    </div>
  </p-card>
</section>
