<div class="p-6">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <p-card>
      <ng-template pTemplate="title">
        Revenue Summary
      </ng-template>

      <p>Total Potential: ₹{{ totalRevenue() }}</p>
      <p>Active Revenue: ₹{{ activeRevenue() }}</p>
      <p>Inactive Loss: ₹{{ inactiveLoss() }}</p>
    </p-card>

    <p-card>
      <ng-template pTemplate="title">
        Revenue Distribution
      </ng-template>

      <p-chart type="pie" [data]="revenueChart()"></p-chart>
    </p-card>

  </div>

</div>
