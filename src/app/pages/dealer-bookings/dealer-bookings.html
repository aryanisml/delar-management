<section class="dealer-page dashboard-shell">
  <p-card class="dashboard-panel">
    <ng-template pTemplate="title">Bookings</ng-template>
    <p class="page-copy">
      Upcoming reservations, confirmation tasks and customer follow-ups can sit here with medium
      emphasis actions so they remain easy to scan without overpowering inventory work.
    </p>
    <div class="dashboard-button-row">
      <button pButton label="View Calendar" icon="pi pi-calendar" class="dashboard-btn dashboard-btn--soft"></button>
      <button pButton label="Export Schedule" icon="pi pi-download" class="dashboard-btn dashboard-btn--ghost"></button>
    </div>
  </p-card>
</section>
