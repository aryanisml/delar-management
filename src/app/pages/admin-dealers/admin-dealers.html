<p-toast></p-toast>

<p-card>
  <ng-template pTemplate="title">
    Dealer Management
  </ng-template>

  <p-table
    [value]="dealers()"
    [paginator]="true"
    [rows]="10"
    responsiveLayout="scroll"
    dataKey="user_id"
    styleClass="p-datatable-sm p-datatable-striped">

    <ng-template pTemplate="header">
      <tr>
        <th>User ID</th>
        <th>Role</th>
        <th style="width:150px">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.user_id }}</td>

        <td>
          <p-tag value="Dealer" severity="info"></p-tag>
        </td>

        <td>
          <button
            pButton
            icon="pi pi-arrow-up"
            label="Promote"
            class="p-button-sm p-button-success"
            (click)="promote(row.user_id)">
          </button>
        </td>
      </tr>
    </ng-template>

  </p-table>
</p-card>
