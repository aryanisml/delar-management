<header class="shadow-sm bg-white sticky top-0 z-50">
  <div class="max-w-screen-xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button pButton type="button" icon="pi pi-bars" 
              class="p-button-text text-gray-600 md:hidden" 
              (click)="toggleMenu()"></button>
      
      <div class="flex items-center gap-2">
        <div class="text-xl font-bold text-blue-600 tracking-tight">AutoFlow</div>
        <div class="hidden sm:block text-gray-300">|</div>
        <div class="hidden sm:block text-xs font-semibold text-gray-500 uppercase tracking-widest">
          {{ role() }} Portal
        </div>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button pButton type="button" label="Logout" icon="pi pi-sign-out"
              (click)="signOut()" class="p-button-danger p-button-sm p-button-outlined">
      </button>
    </div>
  </div>
</header>

<div class="flex bg-gray-50 min-h-[calc(100vh-64px)]">
  <aside class="bg-white shadow-md border-r border-gray-100 p-4 w-64 hidden md:block"
         [class.hidden]="!menuOpen() && false">
    
    <div class="flex flex-col gap-4">
      <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl mb-2">
        <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold shadow-sm">
          {{ userLetter() }}
        </div>
        <div class="flex flex-col overflow-hidden">
          <span class="font-bold text-sm text-gray-800 truncate">{{ userName() }}</span>
          <span class="text-[10px] text-blue-600 font-bold uppercase">{{ role() }}</span>
        </div>
      </div>

      <nav>
        <ul class="space-y-1">
          @for (item of menuItems(); track item.label) {
            <li (click)="navigate(item)"
                class="flex items-center gap-3 p-3 rounded-lg hover:bg-blue-50 hover:text-blue-700 transition-all cursor-pointer group">
              <i [class]="item.icon + ' text-lg text-gray-400 group-hover:text-blue-600'"></i>
              <span class="font-medium text-gray-700 group-hover:text-blue-700">{{ item.label }}</span>
            </li>
          }
        </ul>
      </nav>
    </div>
  </aside>

  <main class="flex-1 p-6">
    <router-outlet></router-outlet>
  </main>
</div>

<footer class="bg-white border-t border-gray-100">
  <div class="max-w-screen-xl mx-auto px-4 py-4 text-center text-xs text-gray-400 font-medium">
    © {{ currentYear }} AUTOFLOW SYSTEMS • Smart Dealership Intelligence
  </div>
</footer>
