@if (!initialized()) {
  <div class="flex min-h-screen items-center justify-center bg-slate-50 text-sm text-slate-500">
    Loading workspace...
  </div>
} @else if (isAdmin()) {
  <div class="flex h-screen overflow-hidden bg-content">
    @if (!desktopSidebarCollapsed()) {
      <div class="hidden lg:block">
        <app-admin-sidebar
          [roleLabel]="'Administrator'"
          [userName]="userName()"
          [pendingBookingsCount]="pendingBookingsCount()"
          [vehicleCount]="vehiclesCount()"
          (logout)="signOut()">
        </app-admin-sidebar>
      </div>
    }

    <p-drawer
      [visible]="mobileSidebarOpen()"
      (visibleChange)="mobileSidebarOpen.set($event)"
      position="left"
      [showCloseIcon]="false"
      styleClass="lg:hidden !w-72 !p-0">
      <app-admin-sidebar
        [roleLabel]="'Administrator'"
        [userName]="userName()"
        [pendingBookingsCount]="pendingBookingsCount()"
        [vehicleCount]="vehiclesCount()"
        (linkClick)="closeMobileSidebar()"
        (logout)="signOut()">
      </app-admin-sidebar>
    </p-drawer>

    <div class="admin-layout-content flex min-w-0 flex-1 flex-col overflow-hidden" [class.admin-layout-content--expanded]="desktopSidebarCollapsed()">
      <app-admin-topbar
        [title]="pageTitle()"
        [homeRoute]="homeRoute()"
        [breadcrumbItems]="breadcrumbItems()"
        [searchValue]="pageSearch()"
        [notificationCount]="notificationCount()"
        [notifications]="notifications()"
        [userInitials]="userLetter()"
        [userMenuItems]="userMenuItems()"
        (menuToggle)="toggleSidebar()"
        (searchChange)="onSearchChange($event)"
        (markAllRead)="markNotificationsRead()">
      </app-admin-topbar>

      <main class="flex-1 overflow-y-auto p-4 lg:p-6">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
} @else {
  <div class="flex h-screen overflow-hidden bg-content">
    @if (!desktopSidebarCollapsed()) {
      <div class="hidden lg:block">
        <app-admin-sidebar
          [roleLabel]="'Dealer Portal'"
          [userName]="userName()"
          [pendingBookingsCount]="pendingBookingsCount()"
          [vehicleCount]="vehiclesCount()"
          [items]="dealerMenuItems()"
          (logout)="signOut()">
        </app-admin-sidebar>
      </div>
    }

    <p-drawer
      [visible]="mobileSidebarOpen()"
      (visibleChange)="mobileSidebarOpen.set($event)"
      position="left"
      [showCloseIcon]="false"
      styleClass="lg:hidden !w-72 !p-0">
      <app-admin-sidebar
        [roleLabel]="'Dealer Portal'"
        [userName]="userName()"
        [pendingBookingsCount]="pendingBookingsCount()"
        [vehicleCount]="vehiclesCount()"
        [items]="dealerMenuItems()"
        (linkClick)="closeMobileSidebar()"
        (logout)="signOut()">
      </app-admin-sidebar>
    </p-drawer>

    <div class="admin-layout-content flex min-w-0 flex-1 flex-col overflow-hidden" [class.admin-layout-content--expanded]="desktopSidebarCollapsed()">
      <app-admin-topbar
        [title]="pageTitle()"
        [homeRoute]="homeRoute()"
        [breadcrumbItems]="breadcrumbItems()"
        [searchValue]="pageSearch()"
        [notificationCount]="notificationCount()"
        [notifications]="notifications()"
        [userInitials]="userLetter()"
        [userMenuItems]="userMenuItems()"
        (menuToggle)="toggleSidebar()"
        (searchChange)="onSearchChange($event)"
        (markAllRead)="markNotificationsRead()">
      </app-admin-topbar>

      <main class="flex-1 overflow-y-auto p-4 lg:p-6">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
}
