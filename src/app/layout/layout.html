<header class="shadow-sm bg-white">
  <div class="max-w-screen-xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button
        pButton
        type="button"
        icon="pi pi-bars"
        class="p-button-text text-gray-600"
        (click)="toggleMenu()"
      ></button>
      <div class="text-lg font-semibold">Dealer Management</div>
    </div>
    <div class="flex items-center gap-3">
      <button
        pButton
        type="button"
        label="Logout"
        icon="pi pi-sign-out"
        (click)="signOut()"
        class="p-button-danger"
      ></button>
    </div>
  </div>
</header>

<div class="flex bg-gray-50 min-h-[calc(100vh-64px)]">
  <aside
    class="bg-white shadow rounded-r-lg p-4 w-64 hidden md:block"
    [class.hidden]="!menuOpen() && false"
  >
    <div class="flex flex-col gap-4">
      <div class="flex items-center gap-3">
        <div
          class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold"
        >
          A
        </div>
        <div>
          <div class="font-semibold">{{ role() === 'admin' ? 'Admin' : 'User' }}</div>
          <div class="text-xs text-gray-500">({{ role() }})</div>
        </div>
      </div>

      <nav class="mt-4">
        <ul class="space-y-2">
          @for (item of menuItems(); track item.label) {
            <li
              (click)="navigate(item)"
              class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 cursor-pointer"
            >
              <i [class]="item.icon + ' text-lg text-gray-600'"></i>
              <span class="text-gray-700">{{ item.label }}</span>
            </li>
          }
        </ul>
      </nav>
    </div>
  </aside>

  <main class="flex-1 p-6">
    <router-outlet></router-outlet>
  </main>
</div>

<footer class="bg-white mt-6">
  <div class="max-w-screen-xl mx-auto px-4 py-4 text-center text-sm text-gray-500">
    © {{ currentYear }} Dealer Management
  </div>
</footer>
