<div class="flex h-screen overflow-hidden bg-content">
  <div class="hidden lg:block">
    <app-admin-sidebar
      [roleLabel]="role() === 'admin' ? 'Administrator' : 'Dealer'"
      [userName]="userName()"
      [pendingBookingsCount]="pendingBookingsCount()"
      [vehicleCount]="vehiclesCount()"
      (logout)="signOut()">
    </app-admin-sidebar>
  </div>

  <p-drawer
    [visible]="mobileSidebarOpen()"
    (visibleChange)="mobileSidebarOpen.set($event)"
    position="left"
    [showCloseIcon]="false"
    styleClass="lg:hidden !w-72 !p-0">
    <app-admin-sidebar
      [roleLabel]="role() === 'admin' ? 'Administrator' : 'Dealer'"
      [userName]="userName()"
      [pendingBookingsCount]="pendingBookingsCount()"
      [vehicleCount]="vehiclesCount()"
      (linkClick)="closeMobileSidebar()"
      (logout)="signOut()">
    </app-admin-sidebar>
  </p-drawer>

  <div class="flex min-w-0 flex-1 flex-col overflow-hidden lg:pl-64">
    <app-admin-topbar
      [title]="pageTitle()"
      [breadcrumbItems]="breadcrumbItems()"
      [searchValue]="pageSearch()"
      [notificationCount]="notificationCount()"
      [notifications]="notifications()"
      [userInitials]="userName().charAt(0).toUpperCase()"
      [userMenuItems]="userMenuItems()"
      (menuToggle)="toggleSidebar()"
      (searchChange)="onSearchChange($event)"
      (markAllRead)="markNotificationsRead()">
    </app-admin-topbar>

    <main class="flex-1 overflow-y-auto p-4 lg:p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
