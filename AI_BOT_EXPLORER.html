<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>AI Booking Assistant — Code Explorer</title>
<style>
  :root{
    --bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;--bg4:#252d3d;
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
    --text:#e2e8f0;--muted:#8892a4;--faint:#4a5568;
    --purple:#8b5cf6;--purple-soft:#1e1535;--purple-border:#4c2f8a;
    --teal:#14b8a6;--teal-soft:#0d2623;--teal-border:#0f7066;
    --amber:#f59e0b;--amber-soft:#231a05;--amber-border:#854d0e;
    --coral:#f97316;--coral-soft:#271508;--coral-border:#9a3412;
    --blue:#3b82f6;--blue-soft:#0d1f3c;--blue-border:#1d4ed8;
    --green:#22c55e;--green-soft:#0a1f0f;--green-border:#15803d;
    --red:#ef4444;--red-soft:#2a0a0a;--red-border:#991b1b;
    --pink:#ec4899;
    --font-mono:'JetBrains Mono','Fira Code','Consolas',monospace;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --radius:8px;--radius-lg:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;font-size:14px;}

  #sidebar{width:272px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
  #sidebar-header{padding:15px 14px 9px;border-bottom:1px solid var(--border);}
  #sidebar-header .app-name{font-size:13px;font-weight:700;color:var(--teal);letter-spacing:.05em;text-transform:uppercase;}
  #sidebar-header .app-sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4;}
  #search-wrap{padding:9px 12px;border-bottom:1px solid var(--border);}
  #search{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;color:var(--text);font-size:12.5px;outline:none;}
  #search:focus{border-color:var(--teal-border);}
  #sidebar-scroll{flex:1;overflow-y:auto;padding:6px 0 30px;}
  #sidebar-scroll::-webkit-scrollbar{width:5px;} #sidebar-scroll::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px;}
  .nav-file{padding:11px 14px 2px;display:flex;align-items:center;gap:7px;}
  .nav-file .fdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .nav-file .ftxt{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .nav-file .fcount{margin-left:auto;font-size:9.5px;color:var(--faint);background:var(--bg3);border-radius:8px;padding:1px 6px;}
  .nav-path{padding:0 14px 3px 29px;font-size:9px;color:var(--faint);font-family:var(--font-mono);word-break:break-all;}
  .nav-item{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 29px;cursor:pointer;color:var(--muted);font-size:12px;border-left:2px solid transparent;transition:all .12s;user-select:none;font-family:var(--font-mono);}
  .nav-item:hover{background:var(--bg3);color:var(--text);} .nav-item.active{background:var(--bg3);color:var(--text);border-left-color:var(--teal);}
  .nav-item .reuse-pill{font-family:var(--font);font-size:8px;background:var(--coral-soft);color:var(--coral);border:1px solid var(--coral-border);border-radius:3px;padding:0 4px;margin-left:auto;}

  #main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  #topbar{padding:11px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg2);flex-shrink:0;}
  #topbar .page-title{font-size:15px;font-weight:600;} #topbar .page-path{font-size:11px;font-family:var(--font-mono);color:var(--muted);background:var(--bg3);padding:2px 8px;border-radius:4px;}
  .tabs{display:flex;gap:2px;margin-left:auto;background:var(--bg3);border-radius:var(--radius);padding:4px;}
  .tab-btn{padding:6px 16px;border-radius:6px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:500;border:none;background:transparent;transition:all .12s;}
  .tab-btn:hover{color:var(--text);background:var(--bg4);} .tab-btn.active{background:var(--bg);color:var(--text);box-shadow:0 0 0 1px var(--border2);}
  #content{flex:1;overflow-y:auto;padding:24px 28px;} #content::-webkit-scrollbar{width:7px;} #content::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
  .panel{display:none;max-width:1020px;} .panel.active{display:block;}
  h2.sec{font-size:18px;font-weight:700;margin-bottom:6px;} p.lead{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px;}

  .kw{border-bottom:1px dotted var(--faint);cursor:help;} .kw:hover{border-bottom-color:var(--teal);color:#fff;}
  #tip{position:fixed;z-index:999;max-width:330px;background:#0b0d13;border:1px solid var(--teal-border);border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.5;color:var(--text);box-shadow:0 8px 30px rgba(0,0,0,.5);pointer-events:none;display:none;}
  #tip .tip-term{color:var(--teal);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  #tip .tip-ex{margin-top:6px;font-family:var(--font-mono);font-size:10.5px;color:var(--amber);background:var(--bg4);padding:4px 6px;border-radius:4px;display:block;line-height:1.45;}

  .fn-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:24px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .fn-section-title:first-child{margin-top:0;} .fn-section-title .fdot{width:9px;height:9px;border-radius:50%;}
  .fn-section-title .fpath{font-family:var(--font-mono);font-weight:500;font-size:10.5px;color:var(--faint);text-transform:none;letter-spacing:0;margin-left:auto;}
  .reuse-banner{background:var(--coral-soft);border:1px solid var(--coral-border);color:#f6a16b;border-radius:8px;padding:9px 13px;font-size:12px;line-height:1.55;margin:8px 0 14px;}
  .fn-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden;transition:border-color .15s;scroll-margin-top:16px;}
  .fn-card:hover{border-color:var(--border2);} .fn-card.flash{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal-border);}
  .fn-header{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;cursor:pointer;}
  .fn-sig{flex:1;min-width:0;}
  .fn-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
  .fn-name{font-family:var(--font-mono);font-size:13.5px;font-weight:600;color:var(--amber);}
  .fn-params{font-family:var(--font-mono);font-size:12px;color:var(--muted);}
  .fn-desc{font-size:13px;color:var(--text);line-height:1.55;}
  .fn-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:4px;font-weight:600;}
  .tag-async{background:var(--blue-soft);color:#7fa8f5;border:1px solid var(--blue-border);}
  .tag-read{background:var(--teal-soft);color:#3fcabb;border:1px solid var(--teal-border);}
  .tag-write{background:var(--coral-soft);color:#f6a16b;border:1px solid var(--coral-border);}
  .tag-ui{background:var(--green-soft);color:#5fd47e;border:1px solid var(--green-border);}
  .tag-reuse{background:var(--coral-soft);color:#f6a16b;border:1px solid var(--coral-border);}
  .tag-private{background:var(--bg3);color:var(--muted);border:1px solid var(--border);}
  .tag-entry{background:var(--purple-soft);color:#b39bf0;border:1px solid var(--purple-border);}
  .fn-expand-btn{font-size:13px;color:var(--faint);transition:transform .15s,color .15s;margin-top:3px;flex-shrink:0;}
  .fn-card.open .fn-expand-btn{transform:rotate(90deg);color:var(--teal);}
  .fn-detail{display:none;border-top:1px solid var(--border);padding:14px 16px;background:var(--bg3);}
  .fn-card.open .fn-detail{display:block;}
  .fn-row{display:flex;gap:12px;margin-bottom:9px;font-size:12.5px;line-height:1.6;}
  .fn-row .lbl{color:var(--muted);font-weight:700;min-width:90px;flex-shrink:0;text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;padding-top:2px;}
  .fn-row .val{color:var(--text);flex:1;}
  code,.mono{font-family:var(--font-mono);font-size:11.5px;background:var(--bg4);color:var(--amber);padding:1px 5px;border-radius:3px;}
  .loc{font-family:var(--font-mono);font-size:11px;color:var(--teal);}
  .caller{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--border2);border-radius:5px;padding:2px 8px;margin:0 4px 4px 0;font-size:11.5px;color:var(--muted);}
  .caller.link{cursor:pointer;color:#b39bf0;border-color:var(--purple-border);} .caller.link:hover{background:var(--purple-soft);}
  .caller .cloc{font-family:var(--font-mono);font-size:10px;color:var(--faint);}

  .walk-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);margin:13px 0 9px;padding-top:11px;border-top:1px dashed var(--border2);display:flex;align-items:center;gap:6px;}
  .walk-row{margin-bottom:9px;}
  .walk-code{display:block;background:#0b0d13;border:1px solid var(--border);border-left:2px solid var(--teal-border);color:#cdd4e0;padding:6px 9px;border-radius:5px 5px 0 0;font-family:var(--font-mono);font-size:11px;white-space:pre-wrap;word-break:break-word;line-height:1.5;}
  .walk-note{font-size:12.5px;color:var(--muted);line-height:1.55;background:var(--bg2);border:1px solid var(--border);border-top:none;border-radius:0 0 5px 5px;padding:6px 9px;}

  .arch{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 18px;margin-bottom:22px;}
  .arch-lane-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 12px;}
  .arch-lane{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px 0;margin-bottom:24px;}
  .arch-box{background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:10px 13px;min-width:128px;text-align:center;display:flex;flex-direction:column;justify-content:center;cursor:pointer;transition:transform .12s,border-color .12s;}
  .arch-box:hover{transform:translateY(-2px);}
  .arch-box .ab-t{font-size:12.5px;font-weight:700;} .arch-box .ab-s{font-size:10px;color:var(--muted);margin-top:3px;font-family:var(--font-mono);}
  .arch-box .ab-fns{font-size:9px;color:var(--faint);margin-top:5px;}
  .arch-box.b-ui{border-color:var(--green-border);} .arch-box.b-ui .ab-t{color:#5fd47e;}
  .arch-box.b-svc{border-color:var(--purple-border);} .arch-box.b-svc .ab-t{color:#b39bf0;}
  .arch-box.b-net{border-color:var(--blue-border);} .arch-box.b-net .ab-t{color:#7fa8f5;}
  .arch-box.b-wire{border-color:var(--amber-border);} .arch-box.b-wire .ab-t{color:#f5c869;}
  .arch-box.b-ext{border-color:var(--teal-border);} .arch-box.b-ext .ab-t{color:#3fcabb;}
  .arch-box.b-tools{border-color:var(--teal-border);} .arch-box.b-tools .ab-t{color:#3fcabb;}
  .arch-box.b-db{border-color:var(--coral-border);} .arch-box.b-db .ab-t{color:#f6a16b;}
  .arch-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);font-size:18px;padding:0 7px;}
  .arch-arrow span{font-size:8.5px;color:var(--faint);}
  .arch-hint{font-size:11.5px;color:var(--muted);margin-top:2px;}

  .flow-step{display:flex;gap:16px;}
  .flow-left{display:flex;flex-direction:column;align-items:center;width:30px;flex-shrink:0;}
  .flow-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bg3);border:1px solid var(--border2);}
  .flow-line{width:2px;flex:1;min-height:14px;margin:3px 0;background:var(--border2);}
  .flow-body{padding-bottom:18px;flex:1;padding-top:3px;}
  .flow-who{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;}
  .flow-title{font-size:14px;font-weight:600;margin-bottom:5px;}
  .flow-desc{font-size:12.8px;color:var(--muted);line-height:1.6;}
  .flow-fns{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;}
  .flow-fn{font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:5px;background:var(--purple-soft);color:#b39bf0;border:1px solid var(--purple-border);cursor:pointer;}
  .flow-fn:hover{background:var(--purple);color:#fff;}
  .flow-fn.ext{background:var(--coral-soft);color:#f6a16b;border-color:var(--coral-border);}
  .w-ui{color:#5fd47e;} .w-svc{color:#b39bf0;} .w-tools{color:#3fcabb;} .w-net{color:#7fa8f5;} .w-ext{color:#f6a16b;} .w-model{color:#f5c869;}

  .alert{border-radius:var(--radius);padding:11px 14px;font-size:12.5px;margin-bottom:16px;line-height:1.6;}
  .alert-info{background:var(--blue-soft);color:#9fc2ff;border:1px solid var(--blue-border);}
  .alert-warn{background:var(--amber-soft);color:#f5c869;border:1px solid var(--amber-border);}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
  .stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .stat-num{font-size:24px;font-weight:700;color:var(--teal);} .stat-label{font-size:11px;color:var(--muted);margin-top:3px;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:11.5px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;} .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .empty{color:var(--faint);font-size:13px;padding:30px;text-align:center;}
</style>
</head>

<script>
const TERMS = {

const ALLFN = {};
GROUPS.forEach(g => g.fns.forEach(f => { f.group = g; ALLFN[f.id] = f; }));  // attach group so fnCard can read f.group.path

function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function escapeRe(s){return s.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&");}
const TERM_KEYS = Object.keys(TERMS).sort((a,b)=>b.length-a.length);
const TERM_RE = new RegExp("(?<![\\w-])(" + TERM_KEYS.map(escapeRe).join("|") + ")(?![\\w-])","gi");
function annotate(text){
  return escapeHtml(text).replace(TERM_RE, m => {
    const key = m.toLowerCase();
    if(!TERMS[key]) return m;
    return '<span class="kw" data-term="'+key+'">'+m+'</span>';
  });
}

const tip = document.getElementById('tip');
function showTip(html, e){ tip.innerHTML = html; tip.style.display='block'; positionTip(e); }
document.addEventListener('mouseover', e => {
  const kw = e.target.closest('.kw');
  if(kw){ const t = TERMS[kw.dataset.term]; if(t){ showTip('<div class="tip-term">'+escapeHtml(kw.dataset.term)+'</div>'+escapeHtml(t.d)+(t.e?'<span class="tip-ex">'+escapeHtml(t.e)+'</span>':''), e); } return; }
  const box = e.target.closest('.arch-box[data-fns]');
  if(box){
    const names = box.dataset.fns.split(',').map(id => (ALLFN[id]?ALLFN[id].name:id));
    showTip('<div class="tip-term">implemented by</div>'+escapeHtml(names.join('  ·  '))+'<span class="tip-ex">click the box to open the first function</span>', e);
  }
});
document.addEventListener('mousemove', e => { if(tip.style.display==='block' && (e.target.closest('.kw')||e.target.closest('.arch-box[data-fns]'))) positionTip(e); });
document.addEventListener('mouseout', e => { if(e.target.closest('.kw')||e.target.closest('.arch-box[data-fns]')){ tip.style.display='none'; } });
function positionTip(e){
  const pad=14; let x=e.clientX+pad, y=e.clientY+pad;
  const r=tip.getBoundingClientRect();
  if(x+r.width>window.innerWidth-8) x=e.clientX-r.width-pad;
  if(y+r.height>window.innerHeight-8) y=e.clientY-r.height-pad;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}

}
function goTo(id){
  const f=ALLFN[id]; if(!f) return;
  switchTab('functions');
  const card=document.getElementById('card-'+id);
  if(card){
    card.classList.add('open','flash');
    card.scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(()=>card.classList.remove('flash'),1600);
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.goto===id));
  }
}
document.addEventListener('click', e=>{ const g=e.target.closest('[data-goto]'); if(g) goTo(g.dataset.goto); });
const TITLES={overview:['Overview','how the bot is wired'],flow:['Flow','one booking, end to end'],functions:['Functions','every function, line by line']};
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));
  document.getElementById('page-title').textContent=TITLES[tab][0];
  document.getElementById('page-path').textContent=TITLES[tab][1];
  document.getElementById('content').scrollTop=0;
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
document.getElementById('search').addEventListener('input',e=>renderTree(e.target.value.trim().toLowerCase()));

renderOverview(); renderFlow(); renderFunctions(); renderTree('');
</script>
